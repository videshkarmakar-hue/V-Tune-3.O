name: Release Automation

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish tag and GitHub Release when decision is GO (manual approval gate). If false, prepare/validate and report GO/NO-GO only."
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      target:
        description: "Target branch/commit for the release"
        required: true
        default: "main"
        type: string
      build:
        description: "Build signed prod release APKs before preparing release"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      modules:
        description: "Comma-separated modules to include (app,tv,wearos)"
        required: true
        default: "app,tv,wearos"
        type: string
      draft:
        description: "Create as draft release when publishing"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-agent:
    name: Detect, Validate, Decide (GO/NO-GO)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Do not attempt trusted build/publish from forks. Validation/decision runs best-effort.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Determine build/signing availability
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          available=false
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            available=true
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: ${{ steps.signing.outputs.available == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build == 'true') && github.event_name != 'pull_request' }}
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup signing and local properties
        if: ${{ steps.signing.outputs.available == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build == 'true') && github.event_name != 'pull_request' }}
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : > local.properties
          [ -n "${LASTFM_API_KEY:-}" ] && echo "LASTFM_API_KEY=$LASTFM_API_KEY" >> local.properties || true
          [ -n "${LASTFM_SECRET:-}" ] && echo "LASTFM_SECRET=$LASTFM_SECRET" >> local.properties || true
          [ -n "${LISTEN_TOGETHER_SERVER:-}" ] && echo "LISTEN_TOGETHER_SERVER=$LISTEN_TOGETHER_SERVER" >> local.properties || true
          echo "$KEYSTORE_BASE64" | base64 -d > bitchord-release.jks
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Grant execute permission for gradlew
        if: ${{ steps.signing.outputs.available == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build == 'true') && github.event_name != 'pull_request' }}
        run: chmod +x gradlew

      - name: Build signed prod release APKs
        if: ${{ steps.signing.outputs.available == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build == 'true') && github.event_name != 'pull_request' }}
        run: ./gradlew :app:assembleProdRelease :tv:assembleProdRelease :wearos:assembleProdRelease --stacktrace

      - name: Prepare, validate, and determine release decision (GO/NO-GO)
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p dist/release
          MODULES="${{ github.event_name == 'workflow_dispatch' && inputs.modules || 'app,tv,wearos' }}"
          BASE_REF=""
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE_REF="${{ github.event.before }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          else
            git fetch origin main --depth=50 >/dev/null 2>&1 || true
            BASE_REF="origin/main"
          fi
          echo "Using base ref: ${BASE_REF:-<none>}"
          python3 scripts/release_agent.py \
            --modules "$MODULES" \
            ${BASE_REF:+--base-ref "$BASE_REF"} \
            --dist-dir dist/release \
            --json-report dist/release/release-report.json \
            --notes-file dist/release/RELEASE_NOTES.md \
            --allow-dirty
          RC=$?
          set -e
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          DECISION="UNKNOWN"
          if [ -f dist/release/release-report.json ]; then
            DECISION=$(python3 - <<'PY'
import json
try:
  d=json.load(open('dist/release/release-report.json','r',encoding='utf-8'))
  print(((d.get('decision') or {}).get('decision') or 'UNKNOWN'))
except Exception:
  print('UNKNOWN')
PY
)
          fi
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "Release decision: $DECISION"
          exit $RC

      - name: Upload release report/bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ github.run_id }}
          path: |
            dist/release/
          if-no-files-found: warn

      - name: Publish GitHub Release (manual dispatch + GO only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == 'true' && steps.prepare.outputs.decision == 'GO' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MODULES="${{ inputs.modules }}"
          TARGET="${{ inputs.target }}"
          DRAFT_FLAG=""
          if [ "${{ inputs.draft }}" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi
          # Manual approval gate: publishing runs only via explicit workflow_dispatch (publish=true)
          # and only when the agent's definitive decision is GO. The agent re-validates and refuses
          # incomplete/invalid/duplicate/NO-GO releases.
          python3 scripts/release_agent.py \
            --modules "$MODULES" \
            --search-dir dist/release \
            --dist-dir dist/release-publish \
            --notes-file dist/release/RELEASE_NOTES.md \
            --target "$TARGET" \
            $DRAFT_FLAG \
            --publish \
            --json-report dist/release-publish/release-report.json

      - name: Validate existing tag release (tag push trigger)
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release exists for $TAG_NAME; validating assets..."
            gh release view "$TAG_NAME" --json tagName,name,assets,url,isDraft,isPrerelease
          else
            echo "Tag $TAG_NAME pushed but no GitHub Release found."
            echo "Run the Release Automation workflow manually (workflow_dispatch, publish=true) after reviewing a GO decision and prepared assets to publish it."
            exit 1
          fi
