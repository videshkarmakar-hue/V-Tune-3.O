name: Auto APK Agent (Every Change)

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-apk-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build-versioned-apk:
    name: Build & package versioned APK for every update
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine signing availability
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          available=false
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            available=true
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"
          if [ "$available" = "true" ]; then
            echo "mode=release-signed" >> "$GITHUB_OUTPUT"
            echo "Signing secrets detected: will produce signed release-ready APK."
          else
            echo "mode=debug-fallback" >> "$GITHUB_OUTPUT"
            echo "Signing secrets missing: will fall back to debug APK."
          fi

      - name: Setup signing and local properties (release mode)
        if: ${{ steps.signing.outputs.available == 'true' }}
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : > local.properties
          [ -n "${LASTFM_API_KEY:-}" ] && echo "LASTFM_API_KEY=$LASTFM_API_KEY" >> local.properties || true
          [ -n "${LASTFM_SECRET:-}" ] && echo "LASTFM_SECRET=$LASTFM_SECRET" >> local.properties || true
          [ -n "${LISTEN_TOGETHER_SERVER:-}" ] && echo "LISTEN_TOGETHER_SERVER=$LISTEN_TOGETHER_SERVER" >> local.properties || true
          echo "$KEYSTORE_BASE64" | base64 -d > bitchord-release.jks
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Setup Firebase config (optional, for FCM push)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            if echo "$GOOGLE_SERVICES_JSON" | tr -d '\n\r\t ' | grep -q '^{'; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            fi
            echo "Wrote app/google-services.json for FCM-enabled build."
          else
            echo "GOOGLE_SERVICES_JSON not set; building without Firebase/FCM config."
          fi

      - name: Compute per-change version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE_NAME=$(grep -oP 'extra\["bitchordVersionName"\]\s*=\s*(?:\(findProperty\([^\n]*?:\s*)?"\K[^"]+' build.gradle.kts | head -n1 || echo "1.0.0")
          BUILD_ID="${GITHUB_RUN_NUMBER}"
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION_NAME="${BASE_NAME}.${BUILD_ID}"
          VERSION_CODE="${BUILD_ID}"
          BETA_SUFFIX="ci.${BUILD_ID}.${SHORT_SHA}"
          TAG="v${VERSION_NAME}-${BETA_SUFFIX}"
          {
            echo "base_name=${BASE_NAME}"
            echo "build_id=${BUILD_ID}"
            echo "short_sha=${SHORT_SHA}"
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
            echo "beta_suffix=${BETA_SUFFIX}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION_NAME} (${VERSION_CODE}) ${BETA_SUFFIX} tag=${TAG}"

      - name: Build signed release-ready APK with unique version
        if: ${{ steps.signing.outputs.available == 'true' }}
        shell: bash
        run: |
          ./gradlew :app:assembleProdRelease \
            -PbitchordVersionName="${{ steps.version.outputs.version_name }}" \
            -PbitchordVersionCode="${{ steps.version.outputs.version_code }}" \
            -PbitchordBetaSuffix="${{ steps.version.outputs.beta_suffix }}" \
            -x lint --console=plain --stacktrace

      - name: Build debug fallback APK with unique version
        if: ${{ steps.signing.outputs.available != 'true' }}
        shell: bash
        run: |
          ./gradlew :app:assembleProdDebug \
            -PbitchordVersionName="${{ steps.version.outputs.version_name }}" \
            -PbitchordVersionCode="${{ steps.version.outputs.version_code }}" \
            -PbitchordBetaSuffix="${{ steps.version.outputs.beta_suffix }}" \
            -x lint --console=plain --stacktrace

      - name: Prepare versioned APK bundle (release agent)
        id: agent
        shell: bash
        env:
          SIGNING_AVAILABLE: ${{ steps.signing.outputs.available }}
        run: |
          set -euo pipefail
          mkdir -p dist/auto-apk
          EXTRA_ARGS=()
          if [ "${SIGNING_AVAILABLE}" = "true" ]; then
            # Signed, release-ready artifact: keep validation (signed app APK, versioned names) intact.
            EXTRA_ARGS+=(--build-types release)
          else
            # Fallback only when signing secrets are unavailable.
            EXTRA_ARGS+=(--build-types debug --allow-unsigned --skip-app-required)
          fi
          python scripts/release_agent.py \
            --version-name "${{ steps.version.outputs.version_name }}" \
            --version-code "${{ steps.version.outputs.version_code }}" \
            --beta-suffix "${{ steps.version.outputs.beta_suffix }}" \
            --search-dir app/build/outputs/apk \
            --dist-dir dist/auto-apk \
            --modules app \
            "${EXTRA_ARGS[@]}" \
            --always-produce-artifacts \
            --allow-dirty \
            --json-report dist/auto-apk/auto-release-report.json
          echo "status=ready" >> "$GITHUB_OUTPUT"

      - name: Upload versioned APK artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: v-tune-auto-apk-${{ steps.signing.outputs.mode }}-${{ steps.version.outputs.tag }}-${{ github.run_attempt }}
          path: |
            dist/auto-apk/*.apk
            dist/auto-apk/RELEASE_NOTES.md
            dist/auto-apk/release-manifest.json
            dist/auto-apk/auto-release-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload version metadata summary
        shell: bash
        run: |
          {
            echo "### Auto APK Agent"
            echo ""
            echo "- Mode: \`${{ steps.signing.outputs.mode }}\`"
            echo "- Version: \`${{ steps.version.outputs.version_name }}\`"
            echo "- Version code: \`${{ steps.version.outputs.version_code }}\`"
            echo "- Suffix: \`${{ steps.version.outputs.beta_suffix }}\`"
            echo "- Tag (generated): \`${{ steps.version.outputs.tag }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Signed release-ready APK produced when signing secrets available; debug fallback only when missing"
            echo "- Artifacts: versioned APK(s), notes, manifest, and agent report uploaded"
          } >> "$GITHUB_STEP_SUMMARY"
