name: Release Notify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to notify about (for manual runs)"
        required: false
        type: string
      url:
        description: "Release URL (optional)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  notify:
    name: Notify app clients about published release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Send release notifications (FCM/webhook if configured)
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          RELEASE_NAME: ${{ github.event.release.name || inputs.tag || github.ref_name }}
          RELEASE_URL: ${{ github.event.release.html_url || inputs.url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          FCM_SERVER_KEY: ${{ secrets.FCM_SERVER_KEY }}
          FCM_TOPIC: ${{ secrets.FCM_TOPIC || 'app-updates' }}
          RELEASE_NOTIFY_WEBHOOK_URL: ${{ secrets.RELEASE_NOTIFY_WEBHOOK_URL }}
        run: |
          python3 scripts/release_notify.py
